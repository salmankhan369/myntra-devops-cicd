name: B17 EKS Project CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Performing Unit Tests
        run: |
          echo "Running unit tests..."
          sleep 5

      - name: Code quality checks
        run: |
          echo "Running code quality checks..."
          sleep 5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Get AWS Account ID & Log in to Amazon ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          aws ecr get-login-password --region ap-south-1 | \
          docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build Docker image
        run: |
          IMAGE_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/b17:${{ github.sha }}
          docker build -t $IMAGE_URI .

      - name: Push image to Amazon ECR 
        run: |
          IMAGE_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/b17:${{ github.sha }}
          docker push $IMAGE_URI

      - name: Verify image in ECR
        run: |
          echo "Checking if image exists in ECR..."
          aws ecr describe-images \
            --repository-name b17 \
            --image-ids imageTag=${{ github.sha }} \
            --region ap-south-1 \
          && echo "✅ Image successfully pushed to ECR" \
          || (echo "❌ Image not found in ECR" && exit 1)